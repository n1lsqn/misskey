name: Check release credentials

on:
  pull_request:
    branches: [n1l]
    paths:
      - .github/workflows/auto-release-n1l.yml
      - .github/workflows/check-release-credentials.yml
      - scripts/auto-release.mjs
      - scripts/auto-release.test.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credentials:
    name: Verify release token access
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      RELEASE_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Verify token and read protected branch checks
        run: |
          test -n "$GH_TOKEN"
          gh api "repos/$RELEASE_REPOSITORY/branches/n1l/protection" \
            --jq '{admin_protection:.enforce_admins.enabled,strict:.required_status_checks.strict,required_checks:(.required_status_checks.contexts | length)}'
          head_sha=$(gh api "repos/$RELEASE_REPOSITORY/git/ref/heads/n1l" --jq '.object.sha')
          gh api "repos/$RELEASE_REPOSITORY/commits/$head_sha/check-runs?per_page=100" --jq '.total_count'
      - name: Verify repository auto-merge
        run: |
          enabled=$(gh api "repos/$RELEASE_REPOSITORY" --jq '.allow_auto_merge')
          test "$enabled" = true
